<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Calendar</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --surface-2: #171b24;
    --border: #262b38;
    --text: #eef0f5;
    --text-dim: #9aa3b6;
    --text-faint: #626a7d;
    --accent: #f4d319;
    --accent-soft: rgba(244, 211, 25, 0.16);
    --holiday: #f2635f;
    --holiday-soft: rgba(242, 99, 95, 0.16);
    --today-ring: #4d55b8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(18, 21, 28, 0.7);
    flex: none;
  }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
  header nav { display: flex; gap: 0.6rem; }
  header nav a {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-decoration: none;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  header nav a:hover { color: var(--text); border-color: var(--accent); }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    min-height: 0;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
    gap: 1.5rem;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .layout { padding: 0.75rem; gap: 1rem; }
    .cal-toolbar { gap: 0.5rem; }
    .cal-title { font-size: 1rem; min-width: 0; }
    .legend { font-size: 0.68rem; gap: 0.5rem; flex-wrap: wrap; }
    .weekday-row div { padding: 0.4rem 0.15rem; font-size: 0.6rem; }
    .day-cell { min-height: 56px; padding: 0.25rem; gap: 0.2rem; }
    .day-num { width: 18px; height: 18px; font-size: 0.68rem; }
    .pill { font-size: 0.58rem; padding: 0.1rem 0.25rem; }
  }

  .cal-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }

  .cal-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .cal-nav { display: flex; align-items: center; gap: 0.5rem; }
  .cal-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav button:hover { border-color: var(--accent); }
  .cal-nav .today-btn {
    width: auto;
    padding: 0 0.9rem;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .cal-title { font-size: 1.15rem; font-weight: 650; min-width: 190px; }

  .legend { display: flex; gap: 1rem; font-size: 0.78rem; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; }

  .grid-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .weekday-row, .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .weekday-row {
    border-bottom: 1px solid var(--border);
  }
  .weekday-row div {
    padding: 0.6rem 0.5rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    text-align: center;
  }
  .day-cell {
    min-height: 92px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 0.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .day-grid .day-cell:nth-child(7n) { border-right: none; }
  .day-cell.outside { background: rgba(255, 255, 255, 0.015); }
  .day-cell.outside .day-num { color: var(--text-faint); }
  .day-num {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-dim);
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .day-cell.today .day-num {
    background: var(--today-ring);
    color: #0b0d12;
  }
  .pill {
    font-size: 0.66rem;
    line-height: 1.3;
    padding: 0.15rem 0.4rem;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .pill:hover { filter: brightness(1.25); }
  .pill.holiday { background: var(--holiday-soft); color: var(--holiday); }

  .side-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .side-head { padding: 1.1rem 1.25rem 0.8rem; border-bottom: 1px solid var(--border); flex: none; }
  .side-head .eyebrow {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 650;
  }
  .side-head h3 { margin: 0.25rem 0 0; font-size: 0.98rem; font-weight: 650; }
  .agenda-list { flex: 1; overflow-y: auto; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .agenda-item {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 10px;
    padding: 0.65rem 0.8rem;
    text-decoration: none;
    color: inherit;
  }
  .agenda-item:hover { border-color: var(--accent); }
  .agenda-item.holiday { border-left-color: var(--holiday); }
  .agenda-item.holiday:hover { border-color: var(--holiday); }
  .agenda-item .name { font-size: 0.84rem; font-weight: 650; }
  .agenda-item .when { font-size: 0.74rem; color: var(--text-dim); margin-top: 0.2rem; }
  .agenda-item .note { font-size: 0.72rem; color: var(--text-faint); margin-top: 0.25rem; }
  .agenda-empty { padding: 2rem 1.2rem; text-align: center; color: var(--text-faint); font-size: 0.82rem; }
</style>
</head>
<body>

<header>
  <h1>School Calendar</h1>
  <nav>
    <a href="/">Back to chat</a>
    <a href="/logout">Log out</a>
  </nav>
</header>

<div class="layout">
  <div class="cal-col">
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button id="prevBtn" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="nextBtn" aria-label="Next month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button id="todayBtn" class="today-btn">Today</button>
      </div>
      <div class="cal-title" id="calTitle"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent);"></span>Term dates</span>
        <span><span class="dot" style="background:var(--holiday);"></span>Holidays</span>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="weekday-row">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div class="day-grid" id="dayGrid"></div>
    </div>
  </div>

  <aside class="side-col">
    <div class="side-head">
      <div class="eyebrow">Agenda</div>
      <h3>Upcoming</h3>
    </div>
    <div class="agenda-list" id="agendaList"></div>
  </aside>
</div>

<script id="eventsData" type="application/json">{{ events_json | safe }}</script>
<script>
  const EVENTS = JSON.parse(document.getElementById("eventsData").textContent);

  function isHoliday(category) {
    return (category || "").toLowerCase().includes("holiday");
  }
  function askUrl(eventName) {
    return "/?ask=" + encodeURIComponent(`Tell me about ${eventName}`);
  }
  function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function eventsOnDate(iso) {
    return EVENTS.filter((e) => e.start <= iso && iso <= e.end);
  }

  const todayISO = toISO(new Date());
  let viewDate = new Date();
  viewDate.setDate(1);

  const calTitle = document.getElementById("calTitle");
  const dayGrid = document.getElementById("dayGrid");
  const monthFormatter = new Intl.DateTimeFormat(undefined, { month: "long", year: "numeric" });

  function renderGrid() {
    calTitle.textContent = monthFormatter.format(viewDate);

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    // Monday-first offset: Sunday (0) -> 6, Monday (1) -> 0, ...
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    const gridStart = new Date(year, month, 1 - startOffset);

    dayGrid.innerHTML = "";
    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const iso = toISO(cellDate);
      const outside = cellDate.getMonth() !== month;

      const cell = document.createElement("div");
      cell.className = "day-cell" + (outside ? " outside" : "") + (iso === todayISO ? " today" : "");

      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = cellDate.getDate();
      cell.appendChild(num);

      if (!outside) {
        for (const ev of eventsOnDate(iso)) {
          const pill = document.createElement("a");
          pill.href = askUrl(ev.name);
          pill.className = "pill" + (isHoliday(ev.category) ? " holiday" : "");
          pill.textContent = ev.name;
          pill.title = `Ask the chatbot about ${ev.name}`;
          cell.appendChild(pill);
        }
      }

      dayGrid.appendChild(cell);
    }
  }

  function formatRange(ev) {
    const opts = { month: "short", day: "numeric" };
    const start = new Date(ev.start + "T00:00:00");
    const end = new Date(ev.end + "T00:00:00");
    const startStr = start.toLocaleDateString(undefined, opts);
    if (ev.start === ev.end) return startStr;
    const endStr = end.toLocaleDateString(undefined, opts);
    return `${startStr} – ${endStr}`;
  }

  function renderAgenda() {
    const upcoming = EVENTS.filter((e) => e.end >= todayISO)
      .sort((a, b) => (a.start < b.start ? -1 : 1))
      .slice(0, 12);

    const list = document.getElementById("agendaList");
    if (!upcoming.length) {
      list.innerHTML = `<div class="agenda-empty">No upcoming events found.</div>`;
      return;
    }
    list.innerHTML = upcoming.map((ev) => `
      <a class="agenda-item ${isHoliday(ev.category) ? "holiday" : ""}" href="${askUrl(ev.name)}" title="Ask the chatbot about ${escapeHtml(ev.name)}">
        <div class="name">${escapeHtml(ev.name)}</div>
        <div class="when">${escapeHtml(formatRange(ev))}${ev.category ? " · " + escapeHtml(ev.category) : ""}</div>
        ${ev.note ? `<div class="note">${escapeHtml(ev.note)}</div>` : ""}
      </a>
    `).join("");
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    renderGrid();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    renderGrid();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    viewDate = new Date();
    viewDate.setDate(1);
    renderGrid();
  });

  renderGrid();
  renderAgenda();
</script>

</body>
</html>
