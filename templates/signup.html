<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>School Info Assistant — Create account</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #12151c;
    --border: #262b38;
    --text: #eef0f5;
    --text-dim: #9aa3b6;
    --text-faint: #626a7d;
    --accent: #f4d319;
    --accent-dim: #c9a90f;
    --error: #e5534b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 15% -10%, rgba(244, 211, 25, 0.06), transparent),
                radial-gradient(900px 500px at 100% 0%, rgba(56, 63, 154, 0.08), transparent), var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem 1.75rem 1.75rem;
    margin: 1.5rem;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #383f9a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #17120a;
    font-size: 1.1rem;
    margin-bottom: 1.1rem;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 0.3rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  p.sub {
    margin: 0 0 1.4rem;
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-bottom: 0.4rem;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 0.85rem;
    color: var(--text);
    font: inherit;
    font-size: 0.94rem;
    outline: none;
    transition: border-color 0.15s ease;
    margin-bottom: 1rem;
  }
  input[type="password"]:focus, input[type="text"]:focus { border-color: var(--accent-dim); }
  .hint { margin: -0.6rem 0 1rem; font-size: 0.74rem; color: var(--text-faint); }
  .switch {
    margin: 1.1rem 0 0;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-dim);
  }
  .switch a { color: var(--accent-dim); text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
  .error {
    margin: 0.7rem 0 0;
    font-size: 0.82rem;
    color: var(--error);
  }
  button {
    width: 100%;
    margin-top: 1.1rem;
    padding: 0.7rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #17120a;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 650;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  button:hover { transform: translateY(-1px); }
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand-mark">🎓</div>
    <h1>Create your account</h1>
    <p class="sub">Pick a username and password to start asking the School Info Assistant questions.</p>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" />
    <p class="hint">At least 6 characters.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit">Create account</button>
    <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</body>
</html>
