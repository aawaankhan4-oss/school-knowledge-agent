# fly.toml app configuration file generated for school-info-assistant on 2026-10-29T08:11:21+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'school-info-assistant'
primary_region = 'lhr'

[build]
[env]
  PORT = '8080'

[[mounts]]
  source = 'school_kb_data'
  destination = '/app/db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
